# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Como usar:
# 1. No painel do Render, clique em "New +" -> "Blueprint" e conecte este repositório
#    GitHub (Jeferson-Ferreira-Araujo/Candles). O Render le este arquivo sozinho.
# 2. Depois de criado o servico, va em "Environment" no painel do Render e preencha as
#    variaveis marcadas abaixo com "sync: false" (elas NAO ficam neste arquivo, que e
#    publico no repositorio):
#      - DATABASE_URL — connection string do Postgres (Supabase). Pegue em: painel do
#        Supabase > projeto candles-12 > Project Settings > Database > Connection String
#        > URI.
#      - POLARIUM_PLATFORM_ID (82, salvo indicacao em contrario da Polarium)
#      - CORS_ORIGIN (a URL do seu frontend na Vercel, ex.: https://seu-app.vercel.app)
# 3. NUNCA coloque POLARIUM_SSID aqui nem em nenhuma variavel de ambiente fixa — o SSID
#    so entra pela tela de login do proprio app (ver webapp/README.md).
#
# Banco: Postgres hospedado no Supabase (projeto "candles-12", org "JA Developer"),
# nao SQLite local — os dados persistem normalmente entre deploys, sem precisar de disco
# persistente no Render. O schema (CREATE TABLE IF NOT EXISTS) e aplicado automaticamente
# toda vez que o servidor sobe.

services:
  - type: web
    name: candles-12-server
    runtime: node
    plan: free
    rootDir: webapp
    # --include=dev e necessario porque NODE_ENV=production (abaixo) faz o "npm install"
    # pular devDependencies por padrao — mas typescript/@types/* (exigidos para compilar)
    # ficam em devDependencies. Sem isso, o build falha com "could not find a declaration
    # file for module 'express'" etc.
    buildCommand: npm install --include=dev && npm run build --workspace shared && npm run build --workspace server
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BROKER_ADAPTER
        value: polarium
      - key: DATABASE_URL
        sync: false
      - key: POLARIUM_PLATFORM_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
