server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota que nao seja um arquivo real cai no index.html (react-router cuida
  # do resto no client). /api e /ws nunca chegam aqui — o Traefik ja roteia direto pro
  # container do backend antes disso.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
